<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contacts ministériels</title>
    <link rel="icon" href="../skin/images/anais_icon_16.png" type="image/x-icon">
    <!--<script src="anaismozutils.js" defer></script>
    <script src="anaismozdlg.js" defer></script>
    <script src="anaismozarbre.js" defer></script>
    <script src="anaistreelist.js" defer></script>
    <script src="anaisrechsdlg.js" defer></script>-->
    <script src="anaisHelpers.js" defer></script>
    <script src="anaisTheme.js" defer></script>
    <script src="anaisListeners.js" defer></script>
    <script src="anaisSearch.js" defer></script>
    <link rel="stylesheet" href="../skin/anais.css">
</head>
<body>

    <header>
        <input type="text" id="anais-tbsearch" class="search-bar" placeholder="Rechercher..." autocomplete="off">
        <div id="anais-suggestions"></div>
        <div class="buttons">
            <button id="anais-rechbt" class="btn-search">
               &nbsp;
            </button>
            <div class="splitter"></div>
            <button id="anaismoz-btprop" class="btn-properties">
                Propriétés
            </button>
            <button id="anaismoz-btcompose" class="btn-message">
                Message
            </button>
            <div class="splitter"></div>
            <button id="anaismoz-btpauline" class="btn-directory">
                Annuaire Web
            </button>
            <button id="anaismoz-btlegend" class="btn-legend">
                Légende
            </button>
            <button id="anaismoz-btabout" class="btn-about">
                À propos
            </button>
        </div>
    </header>

    <div class="content">
        <div class="list">
            <h2>Interactive List</h2>
            <ul id="anais-arbre">
                <li>Item</li>
            </ul>
        </div>
        <div id="context-menu"></div>
        <div class="list">
            <h2>Right List</h2>
            <ul class="tree">
                <li>
                  <details open>
                    <summary>Giant planets</summary>
                    <ul>
                      <li>
                        <details>
                          <summary>Gas giants</summary>
                          <ul>
                            <li>Jupiter</li>
                            <li>Saturn</li>
                          </ul>
                        </details>
                      </li>
                      <li>
                        <details>
                          <summary>Ice giants</summary>
                          <ul>
                            <li>Uranus</li>
                            <li>Neptune</li>
                          </ul>
                        </details>
                      </li>
                    </ul>
                  </details>
                </li>
              </ul>
        </div>
    </div>

</body>
</html>
